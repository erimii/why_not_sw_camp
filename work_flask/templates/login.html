<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: white;
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 400px;
        }
    </style>
</head>
<body>
    <div class="login-box text-center">
        <h3 class="mb-4">🔐 로그인</h3>

        {% if error %}
            <!-- 에러 메시지 UI -->
            <div id="error-section">
                <div class="alert alert-danger">{{ error|safe }}</div>
                <button class="btn btn-outline-secondary" onclick="showLoginForm()">다시 입력하기</button>
            </div>
        {% endif %}

        <!-- 로그인 폼 UI -->
        <form id="login-form" action="/login" method="post" {% if error %}style="display: none;"{% endif %}>
            <div class="mb-3 text-start">
                <label for="username" class="form-label">아이디</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3 text-start">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">로그인</button>
        </form>
    </div>

    <script>
        function showLoginForm() {
            // 에러 메시지 숨기고 input 폼 다시 보여줌
            document.getElementById('error-section').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
        }
    </script>
</body>
</html>
