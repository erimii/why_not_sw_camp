<!-- templates/hello.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hello {{ name or 'Guest' }}</title>
    <!-- Bootstrap CSS CDN -->
    <style>
        body {
            background-color: #f7f9fc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .hello-box {
            background-color: white;
            padding: 3rem 4rem;
            border-radius: 1rem;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .hello-box h1 {
            font-weight: 700;
            color: #007bff;
        }
        .hello-box p {
            color: #666;
        }
    </style>
</head>
<body>
    <div class="hello-box">
         <h1>👋 Hello, {{ name }}!</h1>
        <p>로그인에 성공하셨습니다.</p>
        <a href="/" class="btn btn-secondary mt-3">로그아웃</a>
    </div>
</body>
</html>
